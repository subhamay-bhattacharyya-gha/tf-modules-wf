name: CloudFormation CI Pipeine (Reusable)

description: |
  This is a reusable GitHub Actions workflow for CI/CD of Terraform modules.
  It includes linting, validation, planning, security scanning, testing, and deployment.
  The workflow is triggered on pull requests and can be reused in other workflows.  

on:
  workflow_call:

permissions:
  contents: write
  id-token: write
  actions: write
  deployments: write

jobs:
  tf-fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4@e5f36d523f63a403de144e63e09c5b86719a8c4e

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2@4e6c2fce4ef17eb8624a5e8adf91793f23fd7ad3

      - name: Run terraform fmt
        run: terraform fmt -check -recursive

