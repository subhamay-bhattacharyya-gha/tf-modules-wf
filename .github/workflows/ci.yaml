name: Terraform Module CI Pipeine (Reusable)

description: |
  This is a reusable GitHub Actions workflow for CI/CD of Terraform modules.
  It includes linting, validation, planning, security scanning, testing, and deployment.
  The workflow is triggered on pull requests and can be reused in other workflows.  

on:
  workflow_call:
    inputs:
      terraform-ver:
        description: 'Specifies version of Terraform version e.g: 1.4'
        required: false
        type: number
        default: 1.4
      tflint-ver:
        description: 'Specifies version of TFLint to use. e.g: v0.52.0'
        required: false
        type: string
        default: v0.52.0
      environment:
        description: "Environment to deploy to (e.g., dev, prod)."
        required: true
        type: string
        default: ci
permissions:
  contents: write
  id-token: write
  actions: write
  deployments: write

jobs:
  tf-fmt-check:
    name: TF Format Check
    runs-on: ubuntu-latest
    outputs:
      fmt_status: ${{ steps.fmt-check.outputs.fmt_status }}
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install and Cache Terraform Plugin
        uses: subhamay-bhattacharyya-gha/terraform-plugin-action@feature/SB-0001-initial-release
        with:
          tf-version: 1.4
          caching: true

      - name: Run terraform fmt -check
        id: fmt-check
        run: |
          if terraform fmt -check -recursive -diff > fmt_diff.txt; then
            echo "fmt_status=clean" >> $GITHUB_OUTPUT
            echo "### ✅ Terraform format is clean" >> $GITHUB_STEP_SUMMARY
          else
            echo "fmt_status=dirty" >> $GITHUB_OUTPUT
            echo "### ❌ Terraform formatting issues detected" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            cat fmt_diff.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
        continue-on-error: false

      - name: Upload fmt diff artifact
        if: steps.fmt-check.outputs.fmt_status == 'dirty'
        uses: actions/upload-artifact@v4
        with:
          name: terraform-fmt-diff
          path: fmt_diff.txt

  tf-lint:
    name: TF Lint
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        id: git-checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4.1.0
        with:
          node-version: '20'

      - uses: terraform-linters/setup-tflint@v4
        name: Setup TFLint
        id: setup-tflint
        with:
          tflint_version: ${{ inputs.tflint-ver }}

      - name: Show version
        id: show-tflint-version
        run: tflint --version

      - name: Init TFLint
        id: init-tflint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        id: tflint
        run: tflint | tee tflint.log

      - name: Upload TFLint Summary
        run: |
          if [ -s tflint.log ]; then
            echo '### TFLint Results' >> $GITHUB_STEP_SUMMARY
            cat tflint.log >> $GITHUB_STEP_SUMMARY
          else
            echo '### TFLint Results' >> $GITHUB_STEP_SUMMARY
            echo '✅ TF Lint passed.' >> $GITHUB_STEP_SUMMARY
          fi

      - name: TFLint Status
        id: tflint-status
        if: steps.tflint.outcome == 'failure'
        run: exit 1

  tf-validate:
    name: TF Validate
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        id: git-checkout
        uses: actions/checkout@v4

      - name: Install and Cache Terraform Plugin
        uses: subhamay-bhattacharyya-gha/terraform-plugin-action@feature/SB-0001-initial-release
        with:
          tf-version: 1.4
          caching: true

      - name: Init and Validate
        run: |
          terraform init
          terraform validate -json > validate_output.json

      - name: Upload Terraform Validate Summary
        run: |
          echo '### Terraform Validate Results' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
      
          VALIDATE_JSON=$(cat validate_output.json)
      
          VALID=$(echo "$VALIDATE_JSON" | jq -r '.valid')
          ERROR_COUNT=$(echo "$VALIDATE_JSON" | jq -r '.error_count')
          WARNING_COUNT=$(echo "$VALIDATE_JSON" | jq -r '.warning_count')
      
          if [ "$VALID" == "true" ]; then
            VALID_ICON="✅"
          else
            VALID_ICON="❌"
          fi
      
          echo '| Valid | Errors | Warnings |' >> $GITHUB_STEP_SUMMARY
          echo '|-------|--------|----------|' >> $GITHUB_STEP_SUMMARY
          echo "| $VALID_ICON | $ERROR_COUNT | $WARNING_COUNT |" >> $GITHUB_STEP_SUMMARY
      
          DIAG_COUNT=$(echo "$VALIDATE_JSON" | jq '.diagnostics | length')
          if [ "$DIAG_COUNT" -gt 0 ]; then
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '### Diagnostics' >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '| Severity | Summary |' >> $GITHUB_STEP_SUMMARY
            echo '|----------|---------|' >> $GITHUB_STEP_SUMMARY
            echo "$VALIDATE_JSON" | jq -r '.diagnostics[] | "| \(.severity) | \(.summary) |"' >> $GITHUB_STEP_SUMMARY
          fi
        shell: bash
        
  tf-plan:
    name: TF Plan 🟡
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [tf-fmt-check, tf-lint, tf-validate ]
    steps:
      - name: Git checkout
        id: git-checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials from AWS account
        id: aws-config
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-aws-terraform-oidc

      - name: Install and Cache Terraform Plugin
        uses: subhamay-bhattacharyya-gha/terraform-plugin-action@feature/SB-0001-initial-release
        with:
          tf-version: 1.4
          caching: true

      - name: Terraform Plan
        run: |
          terraform init
          terraform plan -out=plan.tfplan -var-file=terraform.tfvars -no-color
          terraform show -json plan.tfplan > plan.json

